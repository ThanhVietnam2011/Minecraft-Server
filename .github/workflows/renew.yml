name: Auto Renew Zampto

on:
  schedule:
    # Hệ thống tự động thức dậy để gia hạn mỗi 45 phút một lần (Đảm bảo luôn dưới 1 tiếng)
    - cron: '*/45 * * * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thử thủ công bất cứ lúc nào

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện và trình duyệt ẩn
      run: |
        pip install -r requirements.txt
        playwright install chromium

    - name: Chạy script tự động đăng nhập và gia hạn
      env:
        ZAMPTO_EMAIL: ${{ secrets.ZAMPTO_EMAIL }}
        ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
      run: python main.py

    - name: Tải ảnh chụp màn hình lên GitHub nếu xảy ra lỗi
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cloudflare-error-screenshot
        path: cloudflare_blocked.png
